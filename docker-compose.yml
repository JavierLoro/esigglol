services:
  app:
    image: ghcr.io/javierloro/esigglol:latest
    user: "1000"
    ports:
      - "3000:3000"
    # Production values come from the host, deploy platform, or an external
    # secret manager; never copy .env.local to the server.
    environment:
      - SESSION_SECRET
      - ADMIN_PASSWORD_HASH
      - RIOT_API_KEY
      - RIOT_REGION
      - TWITCH_CHANNEL
      - TWITCH_CLIENT_ID
      - TWITCH_CLIENT_SECRET
      - ANTHROPIC_API_KEY
      - REFRESH_AUTO_INTERVAL_MS
      - REFRESH_BATCH_SIZE
      - REFRESH_BATCH_DELAY_MS
      - DB_PATH
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backup:
    # The backup worker uses SQLite's online backup API, so it is safe while
    # the app is writing in WAL mode. BACKUP_HOST_PATH may point to a mounted
    # disk/NFS directory; keep it outside the database volume when possible.
    build:
      context: .
      target: backup
    user: "1000"
    env_file:
      - .env.local
    environment:
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data:ro
      - ${BACKUP_HOST_PATH:-./backups}:/app/backups
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.40
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LABEL_ENABLE=true
    restart: unless-stopped
