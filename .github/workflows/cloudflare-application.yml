name: Cloudflare application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-application-${{ github.ref }}
  cancel-in-progress: false

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npm run check:cloudflare
      - run: npm run test:cloudflare
      - name: Validate Free bundle without deploying
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run
      - name: Deploy Cloudflare application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare -- --keep-vars
      - name: Verify deployed frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run verify:cloudflare:frontend -- https://esiggesports.jlc-dev.me
