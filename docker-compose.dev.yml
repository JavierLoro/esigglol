services:
  app:
    build: .
    user: "1000"
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    build:
      context: .
      target: backup
    user: "1000"
    env_file:
      - .env.local
    environment:
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data:ro
      - ${BACKUP_HOST_PATH:-./backups}:/app/backups
    restart: unless-stopped
